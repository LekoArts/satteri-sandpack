name: Build Package

on: workflow_call

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [22, 24]
    name: Node.js ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          node-version: ${{ matrix.version }}
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Run package checks
        run: pnpm check
